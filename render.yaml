services:
  - type: web
    name: yesno-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false          # задаёшь в дашборде Render
      - key: API_BASE
        value: https://misugram.cloud-ip.cc
